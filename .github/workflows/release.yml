name: Release archive
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Validate version and protect history
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable tag such as v1.1.0"
            exit 1
          fi
          if [[ "$RELEASE_TAG" == "v1.0.0" ]]; then
            echo "::error::Historical v1.0.0 assets must remain unchanged"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "ARCHIVE=stackquay-${version}.zip" >> "$GITHUB_ENV"
          echo "ARCHIVE_PREFIX=stackquay-${version}/" >> "$GITHUB_ENV"
      - name: Require passing CI on the tagged commit
        run: |
          commit=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&status=success" --jq '.workflow_runs | length' > /tmp/ci-count
          test "$(cat /tmp/ci-count)" -gt 0
      - name: Create source archive and checksum
        run: |
          git archive --format=zip --prefix="$ARCHIVE_PREFIX" --output="$ARCHIVE" HEAD
          sha256sum "$ARCHIVE" > SHA256SUMS
      - name: Attach release assets
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" SHA256SUMS
