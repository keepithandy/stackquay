name: Release archive
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.0.0
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Require passing CI on the tagged commit
        run: |
          commit=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&status=success" --jq '.workflow_runs | length' > /tmp/ci-count
          test "$(cat /tmp/ci-count)" -gt 0
      - name: Create source archive and checksum
        run: |
          git archive --format=zip --prefix=handybase-1.0.0/ --output=handybase-1.0.0.zip HEAD
          sha256sum handybase-1.0.0.zip > SHA256SUMS
      - name: Attach release assets
        run: gh release upload "$RELEASE_TAG" handybase-1.0.0.zip SHA256SUMS --clobber
